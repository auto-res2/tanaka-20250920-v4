model_name: "meta-llama/Llama-2-7b-hf"
output_dir: ".research/iteration1/smoke_test_results"
run_name: "hydra_smoke_test"
seed: 42

dataset_config:
  train_datasets: ["yahma/alpaca-cleaned"]
  eval_datasets: ["HuggingFaceH4/mt_bench_prompts"]
  train_samples: 128
  val_samples: 32
  max_seq_length: 512

lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training_args:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  bf16: true
  logging_steps: 5
  report_to: "none"
  max_steps: 10

hydra_loss_delta: 0.5
